[workspace]
resolver = "2"
members = [
    "crates/morceau-core",
    "crates/morceau-ffi",
    "crates/morceau-wasm",
    "crates/morceau-cli",
]

[workspace.package]
version = "0.0.3"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morceau-db/morceau-db"
# v0.0.4-alpha.5 flipped this from `false`. The audit pass cleared
# the morceau-ffi unsafe surface (see crates/morceau-ffi/src/lib.rs);
# v0.0.4 is the first crates.io publish with explicit "pre-v0.1;
# fluid API; expect breakage" semantics in the README.
publish = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# v0.0.3-alpha.3: js-sys for Uint8Array marshalling in the wasm
# host-storage shim (morceau-wasm).
js-sys = "0.3"
futures-channel = { version = "0.3", default-features = false, features = ["std", "alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# v0.0.3-alpha.2: real wasm sleep via setTimeout. `futures` feature
# pulls in gloo_timers::future::TimeoutFuture; default features bring
# in everything else gloo wants and bloats the bundle.
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
bincode = { version = "2", features = ["serde"] }
tempfile = "3"
# v0.0.3-alpha.1: tracing for observability (no-op when no subscriber
# is wired). Required for the cold-start measurement North Star.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# v0.0.3-alpha.1: native-only capability probing. Both crates are
# target-gated in morceau-core so wasm32 builds don't pull them.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
fs2 = "0.4"
morceau-core = { path = "crates/morceau-core", version = "0.0.3" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
