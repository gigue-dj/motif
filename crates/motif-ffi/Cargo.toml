[package]
name = "motif-ffi"
description = "Motif C ABI shim for cdylib consumers (iOS, Android, edge runtimes that aren't wasm hosts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the artifact iOS/Android consumers actually link against.
# rlib: lets motif-cli + tests in this crate work normally.
crate-type = ["cdylib", "rlib"]

[dependencies]
motif-core = { workspace = true }

# Workspace pins `unsafe_code = "forbid"`. motif-ffi is the C ABI
# seam — by construction it needs `unsafe` for any signature taking
# pointers, and `CStr::from_ptr` etc. in tests. `forbid` can't be
# downgraded by `#![allow(...)]`, so this crate doesn't inherit the
# workspace lint set; it re-establishes the clippy defaults locally
# and allows `unsafe_code` explicitly.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
