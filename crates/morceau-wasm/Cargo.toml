[package]
name = "morceau-wasm"
description = "morceau-db WASM bindings (wasm32-unknown-unknown): Morceau::open, query, host-storage shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["graph", "database", "wasm", "embedded", "cypher"]
categories = ["database-implementations", "wasm", "embedded"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
morceau-core = { workspace = true }
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
# v0.0.3-alpha.3: js-sys::Uint8Array for the host-supplied storage
# shim's read_at return value. Already pulled in transitively by
# wasm-bindgen-futures (via gloo-timers in morceau-core wasm deps),
# so the bundle hit is zero — declared explicitly so the import
# isn't accidentally invisible-coupled to a transitive change.
js-sys = { workspace = true }

[lints]
workspace = true
