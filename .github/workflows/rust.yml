name: rust

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  wasm-build:
    name: cargo build + wasm-opt + size budget
    runs-on: ubuntu-latest
    env:
      # v0.0.1 exit criterion 6: <2 MB after wasm-opt -Oz.
      WASM_SIZE_BUDGET_BYTES: 2097152
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install binaryen (for wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: cargo build (wasm32-unknown-unknown)
        run: cargo build --release --target wasm32-unknown-unknown -p motif-wasm

      - name: wasm-opt -Oz
        run: |
          IN=target/wasm32-unknown-unknown/release/motif_wasm.wasm
          OUT=target/wasm32-unknown-unknown/release/motif_wasm.opt.wasm
          wasm-opt -Oz "$IN" -o "$OUT"
          ls -l "$IN" "$OUT"

      - name: Enforce size budget
        run: |
          SIZE=$(stat -c%s target/wasm32-unknown-unknown/release/motif_wasm.opt.wasm)
          echo "optimised wasm size: $SIZE bytes (budget $WASM_SIZE_BUDGET_BYTES)"
          if [ "$SIZE" -gt "$WASM_SIZE_BUDGET_BYTES" ]; then
            echo "FAIL: motif_wasm.opt.wasm exceeds size budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: motif-wasm
          path: target/wasm32-unknown-unknown/release/motif_wasm.opt.wasm

  native-targets:
    # v0.0.3-alpha.4: cargo check for the ios/android cdylib targets.
    # Uses `cargo check` not `cargo build` because a full link needs
    # Apple's clang (Xcode) for iOS or the Android NDK for Android,
    # neither of which is installed on the default ubuntu runner.
    # Compilation is the meaningful smoke — it proves motif-core +
    # motif-ffi build cleanly for these architectures. Full cdylib
    # link verification is tracked as a v0.0.3-alpha.5 audit item
    # (and at that point we may add a macOS runner for the iOS cdylib).
    name: cargo check (aarch64-apple-ios + aarch64-linux-android)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      - name: cargo check (motif-core)
        run: cargo check --release --target ${{ matrix.target }} -p motif-core

      - name: cargo check (motif-ffi)
        run: cargo check --release --target ${{ matrix.target }} -p motif-ffi
